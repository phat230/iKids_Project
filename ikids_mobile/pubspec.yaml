name: ikids_mobile
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Thư viện cần thiết cho dự án iKids:
  http: ^1.2.2
  flutter_secure_storage: ^9.0.0
  youtube_player_flutter: ^9.1.1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  image_picker: ^1.2.2
  path_provider: ^2.1.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ikids_logo.png"
  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/ikids_logo.png"
